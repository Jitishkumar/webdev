<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <span class="childContainer"></span>
        <div class="child">
            this is child
        </div>
    </div>
    <script>
        document.querySelector(".child").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("i am child clicked")
        })
        document.querySelector(".container").addEventListener("click",(e)=>{
            e.stopPropagation()
            alert("i am container span clicked")
        })
        document.querySelector(".childContainer").addEventListener("click",()=>{
            alert("i am childContainer clicked")
        })
        setInterval(()=>{
            document.querySelector(".child").backgroundColor="red"
        },1000);
    </script>
</body>
</html>
